{% set version = "1.1.0" %}

package:
    name: slicerator
    version: {{ version }}

source:
    url: https://github.com/soft-matter/slicerator/archive/v{{ version }}.tar.gz
    sha256: a1fe86cb7c74d1a96fb0a899e8c5af1c5796dbff47ea88170a2e4ae6c2e73344

build:
    number: 0
    script: 
        - cp {{ RECIPE_DIR }}/versioneer.py {{ SRC_DIR }}/ 
        - {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
    host:
        - python
        - pip
        - setuptools
        - wheel
    run:
        - python

test:
    imports:
        - slicerator
    commands:
        - pip check
    requires:
        - pip

about:
    home: https://github.com/soft-matter/slicerator
    license: BSD-3-Clause
    license_file: LICENSE
    license_family: BSD
    summary: A lazy-loading, fancy-sliceable iterable.
    dev_url: https://github.com/soft-matter/slicerator
    doc_url: https://github.com/soft-matter/slicerator

extra:
    recipe-maintainers:
        - danielballan
        - ericdill
        - licode
        - tacaswell
        - caspervdw
